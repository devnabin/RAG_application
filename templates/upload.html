<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Q&amp;A</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f6fb; color: #1f2937;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .card { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.08);
            width: 100%; max-width: 520px; text-align: center; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    p { color: #6b7280; margin: 0 0 28px; }
    .drop { border: 2px dashed #c7d2fe; border-radius: 12px; padding: 32px 16px; cursor: pointer;
            transition: .2s; display: block; }
    .drop:hover, .drop.drag { background: #eef2ff; border-color: #6366f1; }
    .drop input { display: none; }
    #filename { margin-top: 12px; font-weight: 600; word-break: break-all; }
    button { margin-top: 24px; width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #6366f1;
             color: #fff; font-size: 1rem; cursor: pointer; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }
    .error { color: #dc2626; margin-top: 16px; }
    h2 { font-size: 1rem; text-align: left; margin: 32px 0 8px; }
    .files { list-style: none; padding: 0; margin: 0; text-align: left; }
    .files li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid #e5e7eb; }
    .files a { flex: 1; color: #1f2937; text-decoration: none; word-break: break-all; }
    .files a:hover { color: #6366f1; }
    .files form { margin: 0; }
    button.delete { margin: 0; width: auto; padding: 6px 12px; font-size: .85rem; background: #fee2e2; color: #b91c1c; }
    button.delete:hover { background: #fecaca; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Upload your PDF</h1>
    <p>Start question and answer with your PDF</p>
    <form action="/upload" method="post" enctype="multipart/form-data">
      <label class="drop" id="drop">
        <input type="file" name="file" id="file" accept="application/pdf,.pdf" required>
        <div>Click to choose a PDF or drag it here</div>
        <div id="filename"></div>
      </label>
      <button type="submit" id="submit" disabled>Upload &amp; Start</button>
    </form>
    {error}
    {files}
  </div>
  <script>
    const input = document.getElementById("file");
    const drop = document.getElementById("drop");
    const submit = document.getElementById("submit");
    const filename = document.getElementById("filename");

    function update() {
      const f = input.files[0];
      filename.textContent = f ? f.name : "";
      submit.disabled = !f;
    }
    input.addEventListener("change", update);
    ["dragover", "dragenter"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("drag"); }));
    ["dragleave", "drop"].forEach(e => drop.addEventListener(e, () => drop.classList.remove("drag")));
    drop.addEventListener("drop", ev => { ev.preventDefault(); input.files = ev.dataTransfer.files; update(); });
    // Tell the server this session is still open (otherwise its files are deleted after 5 minutes)
    setInterval(() => fetch("/heartbeat", { method: "POST" }), 30000);
    document.querySelector("form").addEventListener("submit", () => { submit.disabled = true; submit.textContent = "Uploading..."; });
  </script>
</body>
</html>
