<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat with PDF</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f6fb; color: #1f2937;
           height: 100vh; display: flex; flex-direction: column; }
    header { background: #fff; padding: 14px 20px; border-bottom: 1px solid #e5e7eb;
             display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    header h1 { font-size: 1.1rem; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    header a { color: #6366f1; text-decoration: none; white-space: nowrap; }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
                max-width: 800px; width: 100%; margin: 0 auto; }
    .msg { padding: 10px 14px; border-radius: 12px; max-width: 80%; white-space: pre-wrap; line-height: 1.4; }
    .user { align-self: flex-end; background: #6366f1; color: #fff; }
    .bot { align-self: flex-start; background: #fff; border: 1px solid #e5e7eb; }
    form { display: flex; gap: 8px; padding: 16px; max-width: 800px; width: 100%; margin: 0 auto; }
    input { flex: 1; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 1rem; }
    button { padding: 12px 20px; border: 0; border-radius: 10px; background: #6366f1; color: #fff; cursor: pointer; }
    button:disabled { background: #a5b4fc; }
  </style>
</head>
<body>
  <header>
    <h1>📄 {filename}</h1>
    <a href="/">My PDFs</a>
  </header>
  <div id="messages">
    <div class="msg bot">Your PDF is uploaded. Ask me anything about it!</div>
  </div>
  <form id="chat">
    <input id="question" placeholder="Ask a question about your PDF..." autocomplete="off" required>
    <button id="send">Send</button>
  </form>
  <script>
    const fileId = "{file_id}";
    // Tell the server this session is still open (otherwise its files are deleted after 5 minutes)
    setInterval(() => fetch("/heartbeat", { method: "POST" }), 30000);
    const messages = document.getElementById("messages");
    const form = document.getElementById("chat");
    const input = document.getElementById("question");
    const send = document.getElementById("send");

    function add(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      add(question, "user");
      input.value = "";
      send.disabled = true;
      const pending = add("Thinking...", "bot");
      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ file_id: fileId, question })
        });
        if (res.redirected) {  // PDF is gone (deleted or session expired): go back to the homepage
          window.location.href = "/";
          return;
        }
        const data = await res.json();
        pending.textContent = res.ok ? data.answer : (data.detail || "Something went wrong");
      } catch (err) {
        pending.textContent = "Error: " + err.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
